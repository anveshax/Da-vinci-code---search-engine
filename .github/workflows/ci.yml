name: ANVESHA CI

on:
  push:
    branches: [ main, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: cd frontend && npm ci

      - name: TypeScript & Vite Build
        run: cd frontend && npm run build

      - name: Run Architecture & UI Verification Suites
        run: |
          node scripts/verify-sidebar-drawer.mjs
          node scripts/verify-globe-implementation.mjs
          node scripts/verify-globe-v3.mjs

  backend-check:
    name: Backend Code Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python Compilation
        run: python -m compileall backend/app backend/engine
